<section class="login-page" aria-labelledby="login-title">
  <div class="login-intro">
    <img
      class="login-logo"
      src="images/logo65x72.jpg"
      alt="NCI-META logo"
      width="72"
      height="72"
    />
    <p class="login-kicker">National Cancer Institute</p>
    <h1 id="login-title">{{ config.title() }}</h1>
    <p class="login-copy">Sign in with your MEME account to continue.</p>
  </div>

  <section class="login-panel" aria-label="Login form">
    <h2>Sign In</h2>

    <form [formGroup]="form" (ngSubmit)="login()">
      <label for="userField">Username</label>
      <input
        id="userField"
        type="text"
        formControlName="userName"
        autocomplete="username"
        required
        autofocus
      >

      <label for="passwordField">Password</label>
      <input
        id="passwordField"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        required
      >

      <button
        id="userLoginButton"
        class="login-submit"
        type="submit"
        [disabled]="working()"
      >
        {{ working() ? 'Signing in' : 'Sign In' }}
      </button>
    </form>
  </section>
</section>
