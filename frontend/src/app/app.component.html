<meme-loading-indicator />
@if (!shellHidden()) {
  <meme-header [attr.inert]="loading.isUiBlocked() ? '' : null" />
}
<meme-notifications [attr.inert]="loading.isUiBlocked() ? '' : null" />

<main
  class="app-main"
  [class.app-main--bare]="shellHidden()"
  [attr.inert]="loading.isUiBlocked() ? '' : null"
>
  <router-outlet />
</main>

@if (!shellHidden()) {
  <meme-footer [attr.inert]="loading.isUiBlocked() ? '' : null" />
}
