tasks.register('prepareInsertionIntegrationDirectories') {
    group = 'Integration'
    description = 'Create local filesystem directories expected by insertion integration tests.'
    doLast {
        def dataDir = System.getenv('DATA_DIR')
        def indexDir = System.getenv('INDEX_DIR')
        def sourceDataDir = System.getenv('SOURCE_DATA_DIR') ?: dataDir
        def lvgDir = System.getenv('LVG_DIR')

        [dataDir, indexDir, sourceDataDir, lvgDir].findAll {
            it != null && !it.trim().isEmpty()
        }.each {
            file(it).mkdirs()
        }

        if (sourceDataDir != null && !sourceDataDir.trim().isEmpty()) {
            file("${sourceDataDir}/terminologies/NCI_INSERT/src").mkdirs()
        }
    }
}

