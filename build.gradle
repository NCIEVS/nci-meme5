// ── Shared admin classpath helper ─────────────────────────────────────────────
// Admin tasks run classes from the compiled main source set.
// Pass system properties from Gradle project properties on the command line,
// e.g.:  ./gradlew adminReindex -Pindexed.objects=ConceptJpa -Pserver=false
// Preferred local usage is to source config/local/setenv.sh first so the
// Spring-style application properties resolve from environment variables.
def adminJvmArgs(Map<String, String> propNames) {
    def args = propNames.collect { key, defaultValue ->
        def val = project.findProperty(key)
        if (key == 'version' && val == ext.artifactVersion) {
            val = null
        }
        if (val != null) {
            "-D${key}=${val}"
        } else {
            def sysPropVal = System.getProperty(key)
            if (sysPropVal != null) {
                "-D${key}=${sysPropVal}"
            } else if (defaultValue != null && !defaultValue.toString().trim().isEmpty()) {
                "-D${key}=${defaultValue}"
            } else {
                null
            }
        }
    }.findAll { it != null }

    return args
}

// ── Admin Tasks ───────────────────────────────────────────────────────────────

// ── Database ──────────────────────────────────────────────────────────────────

task adminCreateDb(type: JavaExec, group: 'Admin',
        description: 'Legacy transitional path: create schema from JPA entities. ' +
                'Use Flyway for versioned schema evolution.') {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wci.umls.server.admin.GeneratorApplication'
    args = ['createDb']
    jvmArgs = ['-Dmode=create'] + adminJvmArgs([:])
}

task adminUpdateDb(type: JavaExec, group: 'Admin',
        description: 'Legacy transitional path: update schema from JPA entities. ' +
                'Use Flyway for versioned schema evolution.') {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wci.umls.server.admin.GeneratorApplication'
    args = ['updateDb']
    jvmArgs = ['-Dmode=update'] + adminJvmArgs([:])
}

def flywayAdminProperties = [
        'flyway.locations': '',
        'flyway.baseline.version': '',
        'flyway.baseline.description': '',
        'flyway.baseline.confirm': ''
]

task adminFlywayMigrate(type: JavaExec, group: 'Admin',
        description: 'Run Flyway migrations against the configured database.') {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wci.umls.server.admin.GeneratorApplication'
    args = ['flywayDb']
    jvmArgs = ['-Dflyway.command=migrate'] + adminJvmArgs(flywayAdminProperties)
}

task adminFlywayInfo(type: JavaExec, group: 'Admin',
        description: 'Show Flyway migration status for the configured database.') {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wci.umls.server.admin.GeneratorApplication'
    args = ['flywayDb']
    jvmArgs = ['-Dflyway.command=info'] + adminJvmArgs(flywayAdminProperties)
}

task adminFlywayValidate(type: JavaExec, group: 'Admin',
        description: 'Validate Flyway migrations against the configured database.') {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wci.umls.server.admin.GeneratorApplication'
    args = ['flywayDb']
