// Top level configuration
buildscript {
    ext {
        springBootVersion = '3.5.14'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://repo.spring.io/release" }
        maven { url "https://repo.spring.io/milestone" }
        maven { url "https://repo.spring.io/snapshot" }
        maven { url "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
    }
}

plugins {
    id 'java'
    id 'war'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.0.0'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://repo.spring.io/release" }
    maven { url "https://repo.spring.io/milestone" }
    maven { url "https://repo.spring.io/snapshot" }
    maven { url "https://plugins.gradle.org/m2/" }
}

apply plugin: 'io.spring.dependency-management'
apply plugin: 'org.springframework.boot'

group = 'com.wcinformatics.umls.server'
version = '2.0.0-SNAPSHOT'
// Saved separately so adminJvmArgs can suppress the artifact version even when -Pversion overrides project.version
ext.artifactVersion = '2.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

configurations.all {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    exclude group: 'commons-logging', module: 'commons-logging'
    resolutionStrategy.force 'org.codehaus.plexus:plexus-utils:3.6.1'
}

dependencyLocking {
    lockAllConfigurations()
}

springBoot {
    mainClass = 'com.wci.umls.Application'
}

def localCatalinaBase = {
    def catalinaBase = System.getenv('CATALINA_BASE')
    if (catalinaBase != null && !catalinaBase.trim().isEmpty()) {
        return catalinaBase
    }
    def appDir = System.getenv('APP_DIR')
    if (appDir != null && !appDir.trim().isEmpty()) {
        return appDir
    }
    return project.projectDir.absolutePath
}

// ── Version constants ──────────────────────────────────────────────────────────
ext {
    hibernateVersion       = '6.6.3.Final'
    hibernateSearchVersion = '7.2.2.Final'
    flywayVersion          = '12.6.1'
    jerseyVersion          = '3.1.11'
    luceneVersion          = '9.9.2'
    jacksonVersion         = '2.16.1'
    mysqlConnectorVersion  = '9.7.0'
}

// Remove once Spring Boot 3.5.x manages Tomcat 10.1.55 or newer.
ext['tomcat.version'] = '10.1.55'

// ── Dependencies ───────────────────────────────────────────────────────────────
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // JPA / Hibernate
    implementation "org.hibernate.orm:hibernate-core:${hibernateVersion}"
    implementation "org.hibernate.orm:hibernate-envers:${hibernateVersion}"
    implementation ("org.hibernate.orm:hibernate-hikaricp:${hibernateVersion}") {
        exclude group: "com.zaxxer", module: "HikariCP"
    }
    implementation "com.zaxxer:HikariCP:6.2.1"
    implementation "org.hibernate.search:hibernate-search-mapper-orm:${hibernateSearchVersion}"
    implementation "org.hibernate.search:hibernate-search-backend-lucene:${hibernateSearchVersion}"
    implementation 'org.jboss.logging:jboss-logging:3.6.0.Final'

    // Flyway is managed manually with the same admin/config path as Hibernate.
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-mysql:${flywayVersion}"

    // Lucene
    implementation "org.apache.lucene:lucene-queryparser:${luceneVersion}"
    implementation "org.apache.lucene:lucene-suggest:${luceneVersion}"

    // MySQL
    implementation "com.mysql:mysql-connector-j:${mysqlConnectorVersion}"

    // Logging
    implementation 'org.slf4j:slf4j-log4j12:1.7.36'
    implementation 'org.apache.logging.log4j:log4j-to-slf4j'

    // WebSocket
    compileOnly        'jakarta.websocket:jakarta.websocket-api:2.1.0'
    implementation     'jakarta.websocket:jakarta.websocket-client-api:2.1.0'

    // Jersey client support
    implementation "org.glassfish.jersey.core:jersey-client:${jerseyVersion}"
    implementation "org.glassfish.jersey.core:jersey-common:${jerseyVersion}"
    implementation "org.glassfish.jersey.media:jersey-media-multipart:${jerseyVersion}"
    implementation "org.glassfish.jersey.media:jersey-media-json-jackson:${jerseyVersion}"
    implementation "org.glassfish.jersey.media:jersey-media-jaxb:${jerseyVersion}"
    implementation "org.glassfish.jersey.inject:jersey-hk2:${jerseyVersion}"

    // OpenAPI / Swagger UI
    implementation('org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14') {
        // Keep the existing SLF4J 1.7 stack while Springdoc supplies OpenAPI support.
        exclude group: 'org.slf4j', module: 'slf4j-simple'
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    // Jakarta EE APIs
    compileOnly    'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    runtimeOnly    'org.glassfish.jaxb:jaxb-runtime:4.0.2'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // Jackson
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    implementation "com.fasterxml.jackson.module:jackson-module-jakarta-xmlbind-annotations:${jacksonVersion}"

    // OWL API
    implementation 'net.sourceforge.owlapi:owlapi-distribution:3.4.3'
    implementation 'net.sourceforge.owlapi:owlapi-api:3.4.3'
    implementation 'net.sourceforge.owlapi:owlapi-apibinding:3.4.3'
    implementation 'net.sourceforge.owlapi:owlapi-impl:3.4.3'

    // Miscellaneous utilities
    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'org.reflections:reflections:0.9.10'

    // Classifiers / Reasoners
    implementation('au.csiro:snorocket-owlapi:2.7.2') {
        exclude group: 'org.glassfish.jersey.media', module: 'jersey-media-moxy'
        exclude group: 'org.eclipse.persistence', module: 'org.eclipse.persistence.moxy'
    }
    implementation('com.hermit-reasoner:org.semanticweb.hermit:1.3.8.4') {
        // axiom-api pulls in old javax.activation geronimo specs which conflict with jakarta.activation
        exclude group: 'org.apache.ws.commons.axiom', module: 'axiom-api'
        exclude group: 'org.apache.geronimo.specs', module: 'geronimo-activation_1.1_spec'
        exclude group: 'org.apache.geronimo.specs', module: 'geronimo-javamail_1.4_spec'
    }

    // LVG
    implementation 'gov.nih.nlm.nls.lvg:lvgdist:2020.0'

    // Trove
    implementation 'net.sf.trove4j:trove4j:3.0.3'

    // Testing & Algorithms that use Assertions
    implementation 'junit:junit:4.13.2'

    // Static analysis annotations
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.2'
    testCompileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.2'

    // Byte-code enhancement
    implementation 'cglib:cglib:3.3.0'

    // Mail
    implementation 'com.sun.mail:jakarta.mail:2.0.1'
    implementation 'jakarta.activation:jakarta.activation-api:2.1.0'

    // ZIP
    implementation 'net.lingala.zip4j:zip4j:2.8.0'

    // Commons
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'org.apache.commons:commons-vfs2:2.10.0'
    implementation 'commons-codec:commons-codec:1.10'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'org.codehaus.plexus:plexus-utils:3.6.1'

    // ANTLR (required by Hibernate Search 7.x)
    implementation 'org.antlr:antlr4-runtime:4.13.0'
}

// ── Static analysis ──────────────────────────────────────────────────────────
checkstyle {
    toolVersion = '12.1.2'
    configDirectory = file('config/checkstyle')
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

spotbugs {
    ignoreFailures = false
    showStackTraces = true
    showProgress = true
    excludeFilter = file('config/spotbugs/excludeFilter.xml')
}

tasks.named('spotbugsMain') {
    reports {
        xml.required = false
        html.required = true
    }
}

tasks.named('spotbugsTest') {
    reports {
        xml.required = false
        html.required = true
    }
}

tasks.named('check') {
    dependsOn tasks.named('spotbugsMain')
    dependsOn tasks.named('spotbugsTest')
}

// ── Webapp packaging ──────────────────────────────────────────────────────────
def generatedWebappDir = file("$buildDir/generated-webapp")
def configWebResourcesDir = file(project.findProperty('web.config.resources.dir')
        ?: 'config/prod-nci-meta/src/main/resources')

tasks.register('prepareWebapp', Sync) {
    into generatedWebappDir
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from('src/main/webapp') {
        exclude 'app/appConfig.js'
    }

    from('src/main/webapp') {
        include 'app/appConfig.js'
        filter { String line ->
            line.replace('${project.version}', project.version.toString())
        }
    }

    // Preserve the deploy-specific branding/content overlay while moving
    // runtime configuration out of legacy config.properties files.
    if (configWebResourcesDir.exists()) {
        from(configWebResourcesDir) {
            include 'app/page/general/**'
            include 'images/**'
        }
    }
}

// ── WAR packaging ─────────────────────────────────────────────────────────────
war {
    archiveBaseName = 'ROOT'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn prepareWebapp
    webAppDirectory = generatedWebappDir

    // Legacy label.prop packaging is no longer required for the normal local
    // or Spring Boot startup path. ConfigUtility now prefers runtime
    // run.config.label / RUN_CONFIG_LABEL overrides if a legacy label is needed.
}

bootJar {
    enabled = false
}

bootWar {
    archiveBaseName = 'ROOT'
    archiveClassifier = 'webapp'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn prepareWebapp
    webAppDirectory = generatedWebappDir
}

bootRun {
    dependsOn prepareWebapp
    systemProperty 'spring.web.resources.static-locations', generatedWebappDir.toURI().toString()
    doFirst {
        def base = localCatalinaBase()
        systemProperty 'catalina.base', base
        file("${base}/logs").mkdirs()
    }
}

// ── Exploded WAR for SmartTomcat deployment ───────────────────────────────────
tasks.register('explodeWar', Copy) {
    dependsOn war
    from zipTree(war.archiveFile)
    into layout.buildDirectory.dir('exploded')
}

// ── Test resources ────────────────────────────────────────────────────────────
sourceSets {
    main {
        // Ensure resources (like persistence.xml) and classes are in the same directory
        // so that Hibernate can find entities when scanning from the persistence unit root.
        output.resourcesDir = java.classesDirectory
    }
    test {
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

// ── Integration tests (*IT.java) ──────────────────────────────────────────────
// Preferred local usage:
//   source config/local/setenv.sh
//   ./gradlew integrationTest
//
// Optionally filter:  --tests "com.wci.umls.server.test.jpa.*"
//                     --tests "com.wci.umls.server.test.rest.*"  (requires running server)
tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (*IT.java).'
    group = 'verification'

    // Include only *IT classes; exclude the plain *Test classes run by :test
    include '**/*IT.class'

    // Forward opt-in Flyway smoke-test properties; those tests require
    // disposable database URLs and are skipped unless explicitly enabled.
    System.getProperties().each { key, value ->
        if (key.toString().startsWith('flyway.it.')) {
            systemProperty key.toString(), value.toString()
        }
    }

    // Allow individual test selection via -Dtest.single=ClassName
    def singleTest = System.getProperty('test.single')
    if (singleTest) {
        include "**/${singleTest}.class"
    }
}

def registerIntegrationPreflight = { taskName, profileName, descriptionText ->
    tasks.register(taskName, JavaExec) {
        description = descriptionText
        group = 'verification'
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'com.wci.umls.server.test.helpers.IntegrationTestPreflight'
        args = [profileName]
        dependsOn tasks.named('testClasses')

        System.getProperties().each { key, value ->
            if (key.toString().startsWith('flyway.it.') ||
                    key.toString().startsWith('integration.it.')) {
                systemProperty key.toString(), value.toString()
            }
        }
    }
}

registerIntegrationPreflight('integrationPreflight', 'sample-jpa',
        'Checks local prerequisites for the default sample JPA integration profile.')
registerIntegrationPreflight('flywayIntegrationPreflight', 'flyway',
        'Checks disposable-schema prerequisites for Flyway integration tests.')
registerIntegrationPreflight('sampleJpaIntegrationPreflight', 'sample-jpa',
        'Checks local prerequisites for sample JPA integration tests.')
registerIntegrationPreflight('nciMetaJpaIntegrationPreflight', 'nci-meta-jpa',
        'Checks local prerequisites for NCI-META JPA integration tests.')
registerIntegrationPreflight('restIntegrationPreflight', 'rest',
        'Checks local prerequisites for REST integration tests.')
registerIntegrationPreflight('insertionIntegrationPreflight', 'insertion',
        'Checks local prerequisites for insertion integration tests.')
registerIntegrationPreflight('adminLoaderIntegrationPreflight', 'admin-loader',
        'Checks local prerequisites for admin/load integration tests.')

tasks.register('prepareFlywayIntegrationSchemas', JavaExec) {
    description = 'Creates missing empty disposable schemas for Flyway integration tests.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wci.umls.server.test.helpers.FlywayIntegrationSchemaSetup'
    dependsOn tasks.named('testClasses')

    System.getProperties().each { key, value ->
        if (key.toString().startsWith('flyway.it.')) {
            systemProperty key.toString(), value.toString()
        }
    }
}

tasks.register('dropFlywayIntegrationSchemas', JavaExec) {
    description = 'Drops generated ephemeral schemas for Flyway integration tests.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wci.umls.server.test.helpers.FlywayIntegrationSchemaSetup'
    args = ['drop']
    dependsOn tasks.named('testClasses')

    System.getProperties().each { key, value ->
        if (key.toString().startsWith('flyway.it.')) {
            systemProperty key.toString(), value.toString()
        }
    }
}

def integrationItSystemProperties = { JavaForkOptions forkOptions ->
    System.getProperties().each { key, value ->
        if (key.toString().startsWith('integration.it.')) {
            forkOptions.systemProperty key.toString(), value.toString()
        }
    }
}

tasks.register('prepareAdminLoaderIntegrationSchema', JavaExec) {
    description = 'Creates the missing disposable schema for admin/load integration tests.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wci.umls.server.test.helpers.DisposableIntegrationSchemaSetup'
    args = ['admin-loader']
    dependsOn tasks.named('testClasses')
    integrationItSystemProperties(delegate)
}

tasks.register('dropAdminLoaderIntegrationSchema', JavaExec) {
    description = 'Drops a generated disposable schema for admin/load integration tests.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wci.umls.server.test.helpers.DisposableIntegrationSchemaSetup'
    args = ['admin-loader', 'drop']
    dependsOn tasks.named('testClasses')
    integrationItSystemProperties(delegate)
}

def flywayItSystemProperties = { Test testTask ->
    System.getProperties().each { key, value ->
        if (key.toString().startsWith('flyway.it.')) {
            testTask.systemProperty key.toString(), value.toString()
        }
    }
}

def registerIntegrationTestProfile = {
    taskName, descriptionText, preflightTaskName, testPatterns ->
        tasks.register(taskName, Test) {
            description = descriptionText
            group = 'verification'
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            include '**/*IT.class'
            dependsOn tasks.named(preflightTaskName)
            shouldRunAfter tasks.named('test')

            testPatterns.each { pattern ->
                filter.includeTestsMatching(pattern)
            }
            filter.failOnNoMatchingTests = true
            flywayItSystemProperties(delegate)
            integrationItSystemProperties(delegate)
        }
}

registerIntegrationTestProfile('flywayIntegrationTest',
        'Runs opt-in Flyway integration tests against disposable schemas.',
        'flywayIntegrationPreflight', [
        'com.wci.umls.server.test.jpa.FlywayMigrationIT'
])

