tasks.register('prepareAdminLoaderIntegrationDirectories') {
    group = 'Integration'
    description = 'Create local filesystem directories expected by admin/load integration tests.'
    doLast {
        def dataDir = System.getenv('DATA_DIR')
        def indexDir = System.getenv('INDEX_DIR')
        def sourceDataDir = System.getenv('SOURCE_DATA_DIR') ?: dataDir
        def lvgDir = System.getenv('LVG_DIR')

        [dataDir, indexDir, sourceDataDir, lvgDir].findAll {
            it != null && !it.trim().isEmpty()
        }.each {
            file(it).mkdirs()
        }

        if (dataDir != null && !dataDir.trim().isEmpty()) {
            copy {
                from 'config/src/main/resources/data'
                into dataDir
                include 'acronyms.txt'
                include 'spelling.txt'
            }
        }
    }
}

