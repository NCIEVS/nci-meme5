// Top level configuration
buildscript {
    ext {
        springBootVersion = '3.5.14'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://repo.spring.io/release" }
        maven { url "https://repo.spring.io/milestone" }
        maven { url "https://repo.spring.io/snapshot" }
        maven { url "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
    }
}

plugins {
    id 'java'
    id 'war'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://repo.spring.io/release" }
    maven { url "https://repo.spring.io/milestone" }
    maven { url "https://repo.spring.io/snapshot" }
    maven { url "https://plugins.gradle.org/m2/" }
}

apply plugin: 'io.spring.dependency-management'
apply plugin: 'org.springframework.boot'

group = 'com.wcinformatics.umls.server'
version = '1.5.1-SNAPSHOT'
// Saved separately so adminJvmArgs can suppress the artifact version even when -Pversion overrides project.version
ext.artifactVersion = '1.5.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

configurations.all {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    exclude group: 'commons-logging', module: 'commons-logging'
}

springBoot {
    mainClass = 'com.wci.umls.Application'
}

// ── Version constants ──────────────────────────────────────────────────────────
ext {
    hibernateVersion       = '6.6.3.Final'
    hibernateSearchVersion = '7.2.2.Final'
    jerseyVersion          = '3.1.11'
    luceneVersion          = '9.9.2'
    jacksonVersion         = '2.16.1'
}

// ── Dependencies ───────────────────────────────────────────────────────────────
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // JPA / Hibernate
    implementation "org.hibernate.orm:hibernate-core:${hibernateVersion}"
    implementation "org.hibernate.orm:hibernate-envers:${hibernateVersion}"
    implementation "org.hibernate.orm:hibernate-c3p0:${hibernateVersion}"
    implementation "org.hibernate.search:hibernate-search-mapper-orm:${hibernateSearchVersion}"
    implementation "org.hibernate.search:hibernate-search-backend-lucene:${hibernateSearchVersion}"
    implementation 'org.jboss.logging:jboss-logging:3.6.0.Final'

    // Lucene
    implementation "org.apache.lucene:lucene-queryparser:${luceneVersion}"
    implementation "org.apache.lucene:lucene-suggest:${luceneVersion}"

    // MySQL
    implementation 'mysql:mysql-connector-java:8.0.17'

    // Logging
    implementation 'org.slf4j:slf4j-log4j12:1.7.36'
    implementation 'org.apache.logging.log4j:log4j-to-slf4j'

    // WebSocket
    compileOnly        'jakarta.websocket:jakarta.websocket-api:2.1.0'
    implementation     'jakarta.websocket:jakarta.websocket-client-api:2.1.0'

    // Jersey client support
    implementation "org.glassfish.jersey.core:jersey-client:${jerseyVersion}"
    implementation "org.glassfish.jersey.core:jersey-common:${jerseyVersion}"
    implementation "org.glassfish.jersey.media:jersey-media-multipart:${jerseyVersion}"
    implementation "org.glassfish.jersey.media:jersey-media-json-jackson:${jerseyVersion}"
    implementation "org.glassfish.jersey.media:jersey-media-jaxb:${jerseyVersion}"
    implementation "org.glassfish.jersey.inject:jersey-hk2:${jerseyVersion}"

    // Swagger
    implementation 'io.swagger.core.v3:swagger-jaxrs2-jakarta:2.2.20'
    implementation 'io.swagger:swagger-annotations:1.6.12'

    // Jakarta EE APIs
    compileOnly    'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    runtimeOnly    'org.glassfish.jaxb:jaxb-runtime:4.0.2'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // Jackson
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    implementation "com.fasterxml.jackson.module:jackson-module-jakarta-xmlbind-annotations:${jacksonVersion}"

    // OWL API
    implementation 'net.sourceforge.owlapi:owlapi-distribution:3.4.3'
    implementation 'net.sourceforge.owlapi:owlapi-api:3.4.3'
    implementation 'net.sourceforge.owlapi:owlapi-apibinding:3.4.3'
    implementation 'net.sourceforge.owlapi:owlapi-impl:3.4.3'

    // Miscellaneous utilities
    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'org.reflections:reflections:0.9.10'

    // Classifiers / Reasoners
    implementation('au.csiro:snorocket-owlapi:2.7.2') {
        exclude group: 'org.glassfish.jersey.media', module: 'jersey-media-moxy'
        exclude group: 'org.eclipse.persistence', module: 'org.eclipse.persistence.moxy'
    }
    implementation('com.hermit-reasoner:org.semanticweb.hermit:1.3.8.4') {
        // axiom-api pulls in old javax.activation geronimo specs which conflict with jakarta.activation
        exclude group: 'org.apache.ws.commons.axiom', module: 'axiom-api'
        exclude group: 'org.apache.geronimo.specs', module: 'geronimo-activation_1.1_spec'
        exclude group: 'org.apache.geronimo.specs', module: 'geronimo-javamail_1.4_spec'
    }

    // LVG
    implementation 'gov.nih.nlm.nls.lvg:lvgdist:2020.0'

    // Trove
    implementation 'net.sf.trove4j:trove4j:3.0.3'

    // Testing & Algorithms that use Assertions
    implementation 'junit:junit:4.13.2'

    // Byte-code enhancement
    implementation 'cglib:cglib:3.3.0'

    // Mail
    implementation 'com.sun.mail:jakarta.mail:2.0.1'
    implementation 'jakarta.activation:jakarta.activation-api:2.1.0'

    // ZIP
    implementation 'net.lingala.zip4j:zip4j:2.8.0'

    // Commons
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'commons-io:commons-io:2.8.0'
    implementation 'org.apache.commons:commons-vfs2:2.0'
    implementation 'commons-codec:commons-codec:1.10'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // ANTLR (required by Hibernate Search 7.x)
    implementation 'org.antlr:antlr4-runtime:4.13.0'
}

// ── Webapp packaging ──────────────────────────────────────────────────────────
def generatedWebappDir = file("$buildDir/generated-webapp")
def configWebResourcesDir = file(project.findProperty('web.config.resources.dir')
        ?: 'config/prod-nci-meta/src/main/resources')

tasks.register('prepareWebapp', Sync) {
    into generatedWebappDir
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from('src/main/webapp') {
        exclude 'app/appConfig.js'
    }

    from('src/main/webapp') {
        include 'app/appConfig.js'
        filter { String line ->
            line.replace('${project.version}', project.version.toString())
        }
    }

    // Preserve the deploy-specific branding/content overlay while moving
    // runtime configuration out of legacy config.properties files.
    if (configWebResourcesDir.exists()) {
        from(configWebResourcesDir) {
            include 'app/page/general/**'
            include 'images/**'
        }
    }
}

// ── WAR packaging ─────────────────────────────────────────────────────────────
war {
    archiveBaseName = 'ROOT'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn prepareWebapp
    webAppDirectory = generatedWebappDir

    // Legacy label.prop packaging is no longer required for the normal local
    // or profile-based startup path. ConfigUtility now prefers runtime
    // run.config.label / RUN_CONFIG_LABEL overrides if a legacy label is needed.
}

bootJar {
    enabled = false
}

bootWar {
    archiveBaseName = 'ROOT'
    archiveClassifier = 'webapp'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn prepareWebapp
    webAppDirectory = generatedWebappDir
}

bootRun {
    dependsOn prepareWebapp
    systemProperty 'spring.web.resources.static-locations', generatedWebappDir.toURI().toString()
}

// ── Exploded WAR for SmartTomcat deployment ───────────────────────────────────
tasks.register('explodeWar', Copy) {
    dependsOn war
    from zipTree(war.archiveFile)
    into layout.buildDirectory.dir('exploded')
}

// ── Test resources ────────────────────────────────────────────────────────────
sourceSets {
    main {
        // Ensure resources (like persistence.xml) and classes are in the same directory
        // so that Hibernate can find entities when scanning from the persistence unit root.
        output.resourcesDir = java.classesDirectory
    }
    test {
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

// ── Integration tests (*IT.java) ──────────────────────────────────────────────
// Preferred local usage:
//   source config/local/setenv.sh
//   ./gradlew integrationTest
//
// Legacy migration fallback:
//   ./gradlew integrationTest -Drun.config.umls=/path/to/config.properties
//
// Optionally filter:  --tests "com.wci.umls.server.test.jpa.*"
//                     --tests "com.wci.umls.server.test.rest.*"  (requires running server)
tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (*IT.java).'
    group = 'verification'

    // Include only *IT classes; exclude the plain *Test classes run by :test
    include '**/*IT.class'

    // Temporary migration fallback: forward explicitly-enabled legacy config
    // properties so ConfigUtility can still find an old-style config file
    // when the Spring application.properties bridge is unavailable.
    System.getProperties().each { key, value ->
        if (key.toString().startsWith('run.config.') ||
                key.toString() == 'config.legacy.runConfig.enabled') {
            systemProperty key.toString(), value.toString()
        }
    }

    // Allow individual test selection via -Dtest.single=ClassName
    def singleTest = System.getProperty('test.single')
    if (singleTest) {
        include "**/${singleTest}.class"
    }
}

// ── Shared admin classpath helper ─────────────────────────────────────────────
// Admin tasks run classes from the compiled main source set.
// Pass system properties from Gradle project properties on the command line,
// e.g.:  ./gradlew adminReindex -Pindexed.objects=ConceptJpa -Pserver=false
// Preferred local usage is to source config/local/setenv.sh first so the
// Spring-style application properties resolve from environment variables.
// Legacy fallback still supports passing both
// -Dconfig.legacy.runConfig.enabled=true and -Drun.config.<label>=<path> to
// point at an old config.properties file during migration, but only when the
// Spring application.properties bridge is unavailable.
def adminJvmArgs(Map<String, String> propNames) {
    def args = propNames.collect { key, _ ->
        def val = project.findProperty(key)
        //
        if (key == 'version' && val == ext.artifactVersion) {
            null
        } else {
            val != null ? "-D${key}=${val}" : null
        }
    }.findAll { it != null }

    // Also check for direct system properties passed via -D flags.
    // This preserves the explicitly-enabled run.config.* migration fallback and
    // also allows -Dversion=2016AA to bypass the Gradle 'version' property collision.
    def sysProps = System.getProperties()
    sysProps.each { key, value ->
        if (key.toString().startsWith('run.config.') ||
                key.toString() == 'config.legacy.runConfig.enabled') {
            args.add("-D${key}=${value}")
        }
    }

    // Forward any propName keys provided as -D system properties that aren't
    // already covered by the -P project-property path above.
    propNames.keySet().each { propKey ->
        if (!args.any { it.toString().startsWith("-D${propKey}=") }) {
            def sysPropVal = System.getProperty(propKey)
            if (sysPropVal != null) {
                args.add("-D${propKey}=${sysPropVal}")
            }
        }
    }

    return args
}

// ── Admin Tasks ───────────────────────────────────────────────────────────────

// ── Database ──────────────────────────────────────────────────────────────────

task adminCreateDb(type: JavaExec, group: 'Admin',
        description: 'Create the database schema from JPA entities (mode=create).') {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wci.umls.server.admin.UpdateDb'
    jvmArgs = ['-Dmode=create'] + adminJvmArgs([:])
}

task adminUpdateDb(type: JavaExec, group: 'Admin',
        description: 'Update the database schema from JPA entities (mode=update).') {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wci.umls.server.admin.UpdateDb'
    jvmArgs = ['-Dmode=update'] + adminJvmArgs([:])
}

task adminAdHoc(type: JavaExec, group: 'Admin',
        description: 'Run the ad-hoc administrative task.') {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wci.umls.server.admin.AdHoc'
    jvmArgs = adminJvmArgs([:])
}

// ── Lucene ────────────────────────────────────────────────────────────────────
// Normal admin usage runs directly with Tomcat stopped:
//   ./gradlew adminReindex -Pindexed.objects=ProjectJpa -Pserver=false
// Leave indexed.objects blank to rebuild all indexes. The server=true path
// exercises the REST endpoint and is separate from the usual direct admin flow.

task adminReindex(type: JavaExec, group: 'Admin',
        description: 'Rebuild Lucene indexes directly. Normal usage: -Pindexed.objects=ClassName -Pserver=false with Tomcat stopped.') {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wci.umls.server.admin.LuceneReindex'
    jvmArgs = adminJvmArgs(['indexed.objects': '', 'server': ''])
}

task adminReindexEcl(type: JavaExec, group: 'Admin',
        description: 'Rebuild ECL (Expression Constraint Language) indexes. Pass -Pterminology, -Pversion, -Pserver.') {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wci.umls.server.admin.LuceneReindexEcl'
    jvmArgs = adminJvmArgs(['terminology': '', 'version': '', 'server': ''])
}

