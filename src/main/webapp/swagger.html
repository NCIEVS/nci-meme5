<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCI-META Terminology Maintenance API - Swagger UI</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
    margin: 0;
  }

  body {
    background: #f4f7f8;
    color: #17232e;
    display: flex;
    flex-direction: column;
    font-family: Arial, Helvetica, sans-serif;
    line-height: 1.4;
  }

  .swagger-shell-header {
    background: #ffffff;
    border-bottom: 1px solid #d6e0e5;
    box-shadow: 0 1px 3px rgba(23, 35, 46, 0.08);
    flex: 0 0 auto;
  }

  .swagger-shell-inner {
    align-items: center;
    display: grid;
    gap: 18px;
    grid-template-columns: auto minmax(0, 1fr);
    margin: 0 auto;
    max-width: 1240px;
    padding: 16px 24px;
  }

  .swagger-shell-logo {
    display: block;
    height: 56px;
    width: auto;
  }

  .swagger-shell-title {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
  }

  .swagger-shell-subtitle {
    color: #52616d;
    margin: 4px 0 0;
    font-size: 14px;
  }

  .swagger-shell-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin-top: 10px;
  }

  .swagger-shell-meta span,
  .swagger-shell-meta a {
    color: #314150;
    font-size: 13px;
  }

  .swagger-shell-meta strong {
    color: #17232e;
  }

  .swagger-shell-meta a {
    text-decoration: none;
  }

  .swagger-shell-meta a:hover,
  .swagger-shell-meta a:focus {
    text-decoration: underline;
  }

  .swagger-shell-auth {
    align-items: center;
    background: #e9f5f3;
    border-top: 1px solid #c8dfdb;
    color: #264640;
    display: flex;
    flex-wrap: wrap;
    font-size: 13px;
    gap: 10px 14px;
    justify-content: center;
    padding: 8px 24px;
  }

  .swagger-shell-auth-form {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .swagger-shell-auth label {
    align-items: center;
    display: inline-flex;
    gap: 5px;
  }

  .swagger-shell-auth input {
    border: 1px solid #b8d2cd;
    border-radius: 4px;
    color: #17232e;
    font: inherit;
    height: 30px;
    padding: 4px 7px;
    width: 150px;
  }

  .swagger-shell-auth button {
    border: 1px solid #1f6b5f;
    border-radius: 4px;
    cursor: pointer;
    font: inherit;
    height: 30px;
    padding: 4px 12px;
  }

  .swagger-shell-auth button[type="submit"] {
    background: #1f6b5f;
    color: #ffffff;
  }

  .swagger-shell-auth button[type="button"] {
    background: #ffffff;
    color: #1f6b5f;
  }

  .swagger-shell-auth button:disabled {
    cursor: not-allowed;
    opacity: 0.65;
  }

  .swagger-shell-auth-status {
    min-height: 18px;
  }

  .swagger-shell-auth-status.error {
    color: #8b1e1e;
  }

  .swagger-shell-auth-status.success {
    color: #1f6b5f;
  }

  .swagger-shell-frame {
    border: 0;
    flex: 1 1 auto;
    min-height: 640px;
    width: 100%;
  }

  .swagger-shell-fallback {
    padding: 24px;
  }

  @media (max-width: 680px) {
    .swagger-shell-inner {
      grid-template-columns: 1fr;
      padding: 14px 18px;
    }

    .swagger-shell-logo {
      height: 44px;
    }

    .swagger-shell-title {
      font-size: 22px;
    }

    .swagger-shell-auth {
      padding: 8px 18px;
      justify-content: flex-start;
    }

    .swagger-shell-auth-form {
      justify-content: flex-start;
    }

    .swagger-shell-auth label,
    .swagger-shell-auth input {
      width: 100%;
    }
  }
</style>
<script>
  var pendingSwaggerAuthToken = null;

  window.addEventListener('DOMContentLoaded', function() {
    var contextPath = window.location.pathname.replace(/\/swagger\.html$/, '');
    var baseUrl = window.location.origin + contextPath;
    var docsPath = contextPath + '/v3/api-docs';
    var swaggerPath = 'swagger-ui/index.html' + window.location.search
        + window.location.hash;

    document.getElementById('base-url').textContent = baseUrl;
    document.getElementById('base-url').href = baseUrl + '/';
    document.getElementById('openapi-docs').textContent = docsPath;
    document.getElementById('openapi-docs').href = docsPath;

    var swaggerFrame = document.getElementById('swagger-frame');
    swaggerFrame.addEventListener('load', function() {
      if (pendingSwaggerAuthToken) {
        preauthorizeSwagger(pendingSwaggerAuthToken);
      }
    });
    swaggerFrame.src = swaggerPath;

    document.getElementById('swagger-login-form').addEventListener('submit',
        function(event) {
          event.preventDefault();
          authenticateSwaggerUser(contextPath);
        });

    document.getElementById('swagger-logout').addEventListener('click',
        clearSwaggerAuth);
  });

  function authenticateSwaggerUser(contextPath) {
    var form = document.getElementById('swagger-login-form');
    var username = document.getElementById('swagger-username').value.trim();
    var password = document.getElementById('swagger-password').value;
    var submitButton = document.getElementById('swagger-login-submit');

    if (!username) {
      setAuthStatus('Enter a username.', 'error');
      return;
    }

    submitButton.disabled = true;
    setAuthStatus('Authenticating...', '');

    fetch(contextPath + '/security/authenticate/' + encodeURIComponent(username),
        {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain',
            'Accept': 'application/json, text/plain'
          },
          body: password
        })
        .then(function(response) {
          return response.text().then(function(body) {
            if (!response.ok) {
              throw new Error(body || response.statusText);
            }
            return body ? JSON.parse(body) : {};
          });
        })
        .then(function(user) {
          if (!user.authToken) {
            throw new Error('Authentication response did not include authToken.');
          }
          pendingSwaggerAuthToken = user.authToken;
          preauthorizeSwagger(user.authToken);
          form.reset();
          setAuthStatus('Authorized as ' + (user.userName || username) + '.',
              'success');
        })
        .catch(function(error) {
          clearSwaggerAuth();
          setAuthStatus(error.message || 'Unable to authenticate user.',
              'error');
        })
        .finally(function() {
          submitButton.disabled = false;
        });
  }

  function preauthorizeSwagger(authToken) {
    var frame = document.getElementById('swagger-frame');
    var swaggerUi = frame && frame.contentWindow && frame.contentWindow.ui;
    if (!swaggerUi || typeof swaggerUi.preauthorizeApiKey !== 'function') {
      pendingSwaggerAuthToken = authToken;
      setAuthStatus('Authenticated. Waiting for Swagger UI...', 'success');
      return;
    }
    swaggerUi.preauthorizeApiKey('authorizationHeader', authToken);
    pendingSwaggerAuthToken = authToken;
  }

  function clearSwaggerAuth() {
    pendingSwaggerAuthToken = null;
    var frame = document.getElementById('swagger-frame');
    var swaggerUi = frame && frame.contentWindow && frame.contentWindow.ui;
    if (swaggerUi && swaggerUi.authActions) {
      swaggerUi.authActions.logout(['authorizationHeader']);
    }
    setAuthStatus('Not authorized.', '');
  }

  function setAuthStatus(message, type) {
    var status = document.getElementById('swagger-auth-status');
    status.textContent = message;
    status.className = 'swagger-shell-auth-status' + (type ? ' ' + type : '');
  }
</script>
</head>
<body>
  <header class="swagger-shell-header">
    <div class="swagger-shell-inner">
      <img class="swagger-shell-logo" src="images/logo65x72.jpg" alt="NCI-META">
      <div>
        <h1 class="swagger-shell-title">NCI-META Terminology Maintenance API</h1>
        <p class="swagger-shell-subtitle">OpenAPI documentation for local REST services.</p>
        <div class="swagger-shell-meta">
          <span><strong>Base URL:</strong> <a id="base-url" href=".">.</a></span>
          <span><strong>OpenAPI Docs:</strong> <a id="openapi-docs" href="v3/api-docs">v3/api-docs</a></span>
        </div>
      </div>
    </div>
    <div class="swagger-shell-auth">
      <form id="swagger-login-form" class="swagger-shell-auth-form">
        <label for="swagger-username">Username
          <input id="swagger-username" name="username" autocomplete="username">
        </label>
        <label for="swagger-password">Password
          <input id="swagger-password" name="password" type="password" autocomplete="current-password">
        </label>
        <button id="swagger-login-submit" type="submit">Log In</button>
        <button id="swagger-logout" type="button">Log Out</button>
      </form>
      <span id="swagger-auth-status" class="swagger-shell-auth-status">Not authorized.</span>
    </div>
  </header>
  <iframe id="swagger-frame" class="swagger-shell-frame" title="Swagger UI"></iframe>
  <noscript>
    <p class="swagger-shell-fallback"><a href="swagger-ui/index.html">Open Swagger UI</a></p>
  </noscript>
</body>
</html>
