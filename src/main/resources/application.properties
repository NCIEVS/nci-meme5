deploy.license.enabled=${DEPLOY_LICENSE_ENABLED:true}
deploy.login.enabled=${DEPLOY_LOGIN_ENABLED:true}
deploy.simpleedit.enabled=${DEPLOY_SIMPLEEDIT_ENABLED:false}
deploy.tracking.code=${DEPLOY_TRACKING_CODE:<!-- sample tracking code -->}
deploy.cookie.code=${DEPLOY_COOKIE_CODE:}
site.verification.file=${SITE_VERIFICATION_FILE:google3aef83c7ba606df3.html}
site.tracking.code=${SITE_TRACKING_CODE:<!-- sample tracking code -->}

#
# URL for security service
#
security.timeout=7200000
security.guest.disabled=${SECURITY_GUEST_DISABLED:true}
security.handler=DEFAULT
security.handler.DEFAULT.class=com.wci.umls.server.jpa.services.handlers.DefaultSecurityServiceHandler
security.handler.DEFAULT.users.admin=${SECURITY_USERS_ADMIN:author,admin,admin1,admin2,admin3,BAC,RAW}
security.handler.DEFAULT.users.user=${SECURITY_USERS_USER:author1,author2,author3,reviewer1,reviewer2,reviewer3,LAR,CFC,DSS}
security.handler.DEFAULT.users.viewer=${SECURITY_USERS_VIEWER:guest}
security.handler.UTS.class=com.wci.umls.server.jpa.services.handlers.UtsSecurityServiceHandler
security.handler.UTS.license.code=${UTS_LICENSE_CODE:NLM-XXX}
security.handler.UTS.url=${UTS_URL:https://uts-ws.nlm.nih.gov/restful/isValidUMLSUser}

#
# Admin user for running admin tasks
#
admin.user=${ADMIN_USER:admin}
admin.password=${ADMIN_PASSWORD:admin}

#
# Integration test parameters
#
viewer.user=${VIEWER_USER:guest}
viewer.password=${VIEWER_PASSWORD:guest}
bad.user=${BAD_USER:i_am_a_bad_user}
bad.password=${BAD_PASSWORD:i_am_a_bad_password}

#
# Exception processing emails
#
mail.enabled=${MAIL_ENABLED:true}
mail.smtp.user=${MAIL_USER:}
mail.smtp.from=${MAIL_FROM:mail@westcoastinformatics.com}
mail.smtp.password=${MAIL_PASSWORD:}
mail.smtp.host=${MAIL_HOST:mail.westcoastinformatics.com}
mail.smtp.port=${MAIL_PORT:587}
mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
mail.smtp.auth=${MAIL_SMTP_AUTH:true}
mail.smtp.to=${MAIL_TO:}
