#
# Spring-style configuration bridge for legacy ConfigUtility consumers.
# Shared defaults live here; environment-specific overrides go in
# application-<profile>.properties.
#
spring.profiles.default=local
config.legacy.runConfig.enabled=${CONFIG_LEGACY_RUN_CONFIG_ENABLED:false}

#
# Shared application directories
#
app.dir=${APP_DIR:${user.home}/nci-meme5}
data.dir=${DATA_DIR:${app.dir}/data}
index.dir=${INDEX_DIR:${data.dir}/indexes-jdk17}
lvg.dir=${LVG_DIR:${data.dir}/lvg2020}
source.data.dir=${SOURCE_DATA_DIR:${data.dir}}

#
# Optional Windows shell support for legacy exec flows that require Cygwin.
#
cygwin.bin=${CYGWIN_BIN:c:/cygwin64/bin}

#
# Database connection parameters
#
hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.connection.useUnicode=true
hibernate.connection.characterEncoding=UTF-8
hibernate.connection.charSet=UTF-8
jakarta.persistence.jdbc.driver=${DB_DRIVER:com.mysql.jdbc.Driver}
jakarta.persistence.jdbc.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:ncimdb}?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&useLocalSessionState=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=${DB_SERVER_TIMEZONE:UTC}
jakarta.persistence.jdbc.user=${DB_USER:root}
jakarta.persistence.jdbc.password=${DB_PASSWORD:}

#
# JPA settings
#
hibernate.show_sql=false
hibernate.format_sql=true
hibernate.use_sql_comments=false
hibernate.jdbc.batch_size=500
hibernate.jdbc.default_batch_fetch_size=32
hibernate.order_inserts=true
hibernate.order_updates=true
hibernate.jdbc.batch_versioned_data=true
hibernate.listeners.envers.autoRegister=false
org.hibernate.envers.store_data_at_delete=true

#
# c3p0 config
#
hibernate.connection.provider_class=org.hibernate.c3p0.internal.C3P0ConnectionProvider
hibernate.c3p0.acquire_increment=${DB_ACQUIRE_INCREMENT:1}
hibernate.c3p0.max_size=${DB_MAX_POOL_SIZE:64}
hibernate.c3p0.min_size=${DB_MIN_POOL_SIZE:5}
hibernate.c3p0.timeout=${DB_MAX_IDLE_TIME:3600}
hibernate.c3p0.idle_test_period=${DB_IDLE_TEST_PERIOD:1800}
hibernate.c3p0.testConnectionOnCheckin=true
hibernate.c3p0.maxConnectionAge=${DB_MAX_CONNECTION_AGE:3600}
hibernate.c3p0.preferredTestQuery=select 1;

#
# Lucene index base
#
hibernate.search.backend.type=lucene
hibernate.search.backend.directory.type=local-filesystem
hibernate.search.backend.directory.root=${index.dir}
hibernate.search.backend.lucene_version=LATEST
hibernate.search.backend.analysis.configurer=class:com.wci.umls.server.jpa.model.helpers.SearchAnalysisConfigurer
org.apache.lucene.search.BooleanQuery.maxClauseCount=1000000
index.packages=com.wci.umls.server

